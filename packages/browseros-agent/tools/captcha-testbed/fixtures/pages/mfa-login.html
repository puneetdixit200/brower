<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dummy login and MFA challenge</title>
  </head>
  <body>
    <main>
      <h1>Dummy login and MFA challenge</h1>
      <p>Local test form only. Use fake values; nothing is authenticated.</p>
      <form action="/submit/mfa-login" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
        <label for="one-time-code">One-time code</label>
        <input id="one-time-code" name="one-time-code" inputmode="numeric" autocomplete="one-time-code" />
        <button id="submit" type="submit">Submit test challenge</button>
      </form>
    </main>
  </body>
</html>
